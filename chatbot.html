<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      /* left side is called css property 
        right side is called css value
      */
      body{
        font-family: Arial;
        margin-top:0px;
        margin-bottom:0px;
      }
      .send-button{
        background-color:rgb(25,135,84);
        color:white;
        padding:12px 20px;
        border:none;
        margin-left:10px;
        border-radius:10px;
        font-size:15px;
        cursor:pointer; 
      }
      .chat-input{
        padding:12px 15px;
        border-radius:10px;
        border-width:1px;
        font-size:15px;

        flex-grow:1
        
      }
      .chat-input-container{
        display:flex;
        margin-bottom:60px;
  
      }
      .app-container{
        max-width: 600px;
        margin-left:auto;
        margin-right:auto;
        height:100vh; /*vh = view height the height of the browser 100vh = 100% of the height of the browser*/
        display:flex;
        flex-direction: column;


      }
      .chat-message-user{
        display:flex;
        justify-content: end;
        align-items: start;
        margin-top: 15px;

      }
      .chat-message-robot{
        display:flex;
        align-items: start;
      }
      .chat-message-text{
        background-color: rgb(238,238,238);
        padding:15px 20px;
        margin-right:10px;
        margin-left:10px;
        border-radius:10px;
        margin-bottom:20px;
        max-width:300px;
        
      }

      .chat-messages-container{
        flex-grow:1;
        margin-top:20px;
        overflow:scroll;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      //hooks = insert react features intoour component
      //useEffect = lets us run some cod after the component is created or updated


      //event.target gives us the element that were typing in
      function ChatInput({chatMessages,setChatMessages}){

        const [inputText,setInputText] = React.useState('')
        function saveInputText(event){
          setInputText(event.target.value)
        }

        //state does not update the data immediately 
        //state is updated after all of the code is finished

        function sendMessage(){
          const newChatMessages = [...chatMessages,
            {
              message:inputText,
              sender:'user',
              id:crypto.randomUUID()
              
            }
          ]
          setChatMessages(newChatMessages)


          const response = Chatbot.getResponse(inputText)

          setChatMessages([...newChatMessages,
            {
              message:response,
              sender:'robot',
              id:crypto.randomUUID()
              
            }
          ])
          
          setInputText('')
        }
        //controlled input
        return (
          <div className="chat-input-container">
            <input 
              type="text" 
              placeholder="Send a message to Chatbot" 
              size ="30"
              onChange={saveInputText} //onChange runs a function when we change the text inside an input
              value={inputText} //value change the test inside this input
              className="chat-input"
            />
            <button className = "send-button" onClick={sendMessage}>Send</button>
          </div>
          
        )
      }
      

      function ChatMessage({message,sender}){

        // if(sender === 'robot'){
        //   return (
        //     <div>
        //       <img src="robot.png" width="50"/>
        //       {message}
              
        //     </div >
        //   )
        // }
        return (
          <div className={sender==='user'?'chat-message-user':'chat-message-robot'}>
            {sender ==='robot'&& <img src="robot.png" width="50"/>}
            <div className="chat-message-text">
              {message}
            </div>
            {sender === 'user' && <img src="user.png" width="50"/>}
          </div >
        );
      }

      //event handlers = run a function when we interact with the website
      //state = data that is connected to the HTML.when we update this data it will update the html

      function ChatMessages({chatMessages}){

        const chatMessagesRef = React.useRef(null)//automatically save an html element from the component
        //ref is a container with special react features

        React.useEffect(()=>{
          const containerElem = chatMessagesRef.current
          if(containerElem){
            containerElem.scrollTop = containerElem.scrollHeight
          }

        },[chatMessages])//react will run this function after the component is created or updated
        //every time the component is updated
        // second parameter is an array it controls when useEffect runs
        //[] only runs once after the component  is created
        //[chatMessage] run this function every time chatMessages chnages and aslo called dependency array controls when useEffect runs

        // const [chatMessages,setChatMessages] = React.useState([{
        //   message:'hello chatbot',
        //   sender:'user',
        //   id:"id1"
        // },{
        //   message:'Hello! How can I help you?',
        //   sender:'robot',
        //   id:'id2'
        // },{
        //   message:'can you get me todays date?',
        //   sender:'user',
        //   id:"id3"
        // },{
        //   message:'Today is september 30',
        //   sender:'robot',
        //   id:'id4'
        // }]) 

        //const [chatMessages,setChatMessages] = array

        //const chatMessages = array[0]//initial value;
        //const setChatMessages = array[1]//updater function 

        //in react we should not update the data directly 
         
        //onClick run some function we click the button
        //onClick is known as event
        // function is called Event Handler

       

        return(
          <div className="chat-messages-container" ref={chatMessagesRef}>
            {chatMessages.map((chatmessage)=>{
                    return  (
                      <ChatMessage 
                        message={chatmessage.message} 
                        sender={chatmessage.sender} 
                        key={chatmessage.id}
                      />
                    )
              })}
          </div>
        )
        

      }

      function App(){

        const [chatMessages,setChatMessages] = React.useState([{
          message:'hello chatbot',
          sender:'user',
          id:"id1"
        },{
          message:'Hello! How can I help you?',
          sender:'robot',
          id:'id2'
        },{
          message:'can you get me todays date?',
          sender:'user',
          id:"id3"
        },{
          message:'Today is september 30',
          sender:'robot',
          id:'id4'
        }])
       
        return(
          <div className="app-container">
           
            <ChatMessages chatMessages={chatMessages}/>
             <ChatInput chatMessages = {chatMessages} setChatMessages={setChatMessages}/>
          </div>
        )
      }

    
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body> 
</html>
