<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      function ChatInput(){
        return (
          <>
            <input type="text" placeholder="Send a message to Chatbot" size ="30"></input>
            <button>submit</button>
          </>
          
        )
      }
      

      function ChatMessage({message,sender}){

        // if(sender === 'robot'){
        //   return (
        //     <div>
        //       <img src="robot.png" width="50"/>
        //       {message}
              
        //     </div >
        //   )
        // }
        return (
          <div>
            {sender ==='robot'&& <img src="robot.png" width="50"/>}
            {message}
            {sender === 'user' && <img src="user.png" width="50"/>}
          </div >
        );
      }

      //event handlers = run a function when we interact with the website

      function ChatMessages(){

         const chatMessages =[{
          message:'hello chatbot',
          sender:'user',
          id:"id1"
        },{
          message:'Hello! How can I help you?',
          sender:'robot',
          id:'id2'
        },{
          message:'can you get me todays date?',
          sender:'user',
          id:"id3"
        },{
          message:'Today is september 30',
          sender:'robot',
          id:'id4'
        }]
        //onClick run some function we click the button
        //onClick is known as event
        // function is called Event Handler

        function sendMessage(){
          chatMessages.push({
            message:"how to make biryani",
            sender:'user',
            id:'id5',
            
          })
          console.log(chatMessages)
        }

        return(
          <>
            <button onClick={sendMessage}>send message</button>
            {chatMessages.map((chatmessage)=>{
                    return  (
                      <ChatMessage 
                        message={chatmessage.message} 
                        sender={chatmessage.sender} 
                        key={chatmessage.id}
                      />
                    )
              })}
          </>
        )
        

      }

      function App(){
       
        return(
          <>
            <ChatInput/>
            <ChatMessages/>
          </>
        )
      }

    
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body> 
</html>
