<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">


      //event.target gives us the element that were typing in
      function ChatInput({chatMessages,setChatMessages}){

        const [inputText,setInputText] = React.useState('')
        function saveInputText(event){
          setInputText(event.target.value)
        }

        //state does not update the data immediately 
        //state is updated after all of the code is finished

        function sendMessage(){
          const newChatMessages = [...chatMessages,
            {
              message:inputText,
              sender:'user',
              id:crypto.randomUUID()
              
            }
          ]
          setChatMessages(newChatMessages)


          const response = Chatbot.getResponse(inputText)

          setChatMessages([...newChatMessages,
            {
              message:response,
              sender:'robot',
              id:crypto.randomUUID()
              
            }
          ])
          
          setInputText('')
        }
        //controlled input
        return (
          <>
            <input 
              type="text" 
              placeholder="Send a message to Chatbot" 
              size ="30"
              onChange={saveInputText} //onChange runs a function when we change the text inside an input
              value={inputText} //value change the test inside this input
            />
            <button onClick={sendMessage}>submit</button>
          </>
          
        )
      }

        // if(sender === 'robot'){

        //       {message}
              
        //     </div >
        //   )
        // }
        return (
          <div>
            {sender ==='robot'&& <img src="robot.png" width="50"/>}
            {message}
            {sender === 'user' && <img src="user.png" width="50"/>}
          </div >
        );
      }

        // },{

        //const [chatMessages,setChatMessages] = array

        //in react we should not update the data directly 
         
        //onClick run some function we click the button

        return(
          <>

      function App(){

        const [chatMessages,setChatMessages] = React.useState([{
          message:'hello chatbot',
          sender:'user',
          id:"id1"
        },{
          message:'Hello! How can I help you?',
          sender:'robot',

        },{

          id:'id4'
        }])
       
        return(
          <>
            <ChatInput chatMessages = {chatMessages} setChatMessages={setChatMessages}/>
            <ChatMessages chatMessages={chatMessages}/>
          </>
        )
      }

    
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App/>);
